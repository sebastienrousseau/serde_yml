[package]
authors = ["Serde YML Contributors"]
categories = ["encoding", "parser-implementations"]
description = """
DEPRECATED — `serde_yml` is unmaintained. This release is a thin compatibility shim that forwards every call to `noyalib` (a pure-Rust, `#![forbid(unsafe_code)]` YAML library). Please migrate to `noyalib`.
"""
documentation = "https://docs.rs/serde_yml/"
edition = "2021"
homepage = "https://github.com/sebastienrousseau/noyalib"
keywords = ["yaml", "serde", "deprecated", "noyalib"]
license = "MIT OR Apache-2.0"
name = "serde_yml"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/serde_yml"
# Bumped from 1.56 — `noyalib` requires Rust 1.85+ (edition 2024).
# Users who cannot move past 1.56 should stay on `serde_yml = "=0.0.12"`.
rust-version = "1.85.0"
version = "0.0.13"
include = [
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/MIGRATION.md",
    "/README.md",
    "/examples/**",
    "/src/**",
    "/tests/**",
]

[dependencies]
# `noyalib` is the actively-maintained pure-Rust YAML library that
# this shim forwards every call to. The `compat-serde-yaml` feature
# exposes a name-for-name surface that this crate re-exports under
# its own historical public path — no double-parsing, no extra
# allocations, no archived advisory chain pulled in transitively.
noyalib = { version = "0.0.5", default-features = false, features = ["std", "compat-serde-yaml"] }
serde = "1.0.204"

[dev-dependencies]
serde = { version = "1.0.204", features = ["derive"] }
serde_derive = "1.0.204"
indoc = "2.0.5"

[features]
default = []

[lib]
name = "serde_yml"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
