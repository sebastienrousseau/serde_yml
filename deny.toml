# cargo-deny config for the serde_yml deprecation shim.
#
# The shim's runtime tree is small: serde + noyalib (which pulls
# indexmap, memchr, rustc-hash, smallvec). The license allowlist
# below covers that surface plus the standard dev-dep proc-macro
# stack (proc-macro2, quote, syn, unicode-ident, rustversion).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",   # unicode-ident (modern Unicode license)
    "Unlicense",     # memchr (dual-licensed Unlicense OR MIT)
]

[bans]
multiple-versions = "warn"
highlight = "all"
skip = []
skip-tree = []

[advisories]
# RUSTSEC-2025-0068 affected serde_yml ≤ 0.0.12 (the C-FFI
# `Serializer.emitter` segfault). The 0.0.13 release removes the
# vulnerable surface entirely — verified via
# `cargo tree -p serde_yml | grep libyml` (no output) — but the
# RustSec advisory DB has not yet been updated to mark 0.0.13 as
# patched, so `cargo deny` self-flags the shim. Remove this entry
# once the advisory database accepts a PR amending
# `patched_versions = "^0.0.13"`.
ignore = ["RUSTSEC-2025-0068"]
